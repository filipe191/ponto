<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Espelhos de ponto · Ponto</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--steel); }
    .print-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; padding: 20px 16px 0; }
    .print-bar .key { height: 44px; padding: 0 18px; }
    .print-bar input { height: 44px; padding: 0 12px; border: 1px solid var(--key-edge); border-radius: 10px; background: var(--key); color: var(--text); font: inherit; }
    .sheets { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
    .sheet { padding: 28px 32px; }
    .sheet h2 { color: var(--rule); font-size: 1.35rem; font-weight: 800; font-stretch: 112%; }
    .sheet .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin: 4px 0 12px; color: var(--muted); font-size: 0.9rem; }
    .sheet table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .sheet th, .sheet td { padding: 3px 6px; border-bottom: 1px solid var(--rule-soft); text-align: left; vertical-align: top; }
    .sheet th { color: var(--rule); font-weight: 600; border-bottom-color: var(--rule); }
    .sheet .n { text-align: right; white-space: nowrap; }
    .sheet tr.muted td { color: var(--muted); }
    .sheet tfoot td { border-top: 2px solid var(--rule); font-weight: 700; }
    .sheet .notes { margin-top: 8px; color: var(--muted); font-size: 0.75rem; }
    .signs { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; font-size: 0.82rem; text-align: center; }
    .signs div { padding-top: 6px; border-top: 1px solid var(--text); }
    .status { color: var(--muted); }
    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff; color: #000; }
      :root { --paper: #fff; --text: #000; --muted: #444; --rule: #1f3b80; --rule-soft: #ccc; }
      .bar, .print-bar { display: none; }
      .sheets { max-width: none; padding: 0; gap: 0; }
      .sheet { padding: 0; box-shadow: none; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/admin">Ponto</a>
    <nav><a href="/admin">Voltar à administração</a></nav>
  </header>

  <div class="print-bar">
    <input type="month" id="month" aria-label="Mês">
    <button class="key key-go" type="button" id="print">Imprimir / salvar PDF</button>
    <span class="form-hint" id="status" role="status"></span>
  </div>
  <div class="sheets" id="sheets"></div>

  <script src="/js/imprimir.js"></script>
</body>
</html>
