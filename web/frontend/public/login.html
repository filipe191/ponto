<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Ponto</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Instalável no tablet: abre como app, em tela cheia (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/relogio-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ponto">
  <meta name="theme-color" content="#3b4852" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b20" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="bar">
    <span class="brand">Ponto</span>
  </header>

  <main class="login-page">
    <section class="machine" aria-labelledby="loginTitle">
      <div class="readout">
        <div class="readout-time" aria-hidden="true"><span id="hm">--:--</span></div>
        <p class="readout-date" id="loginTitle">Entre com a conta de administrador</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <label class="field">
          <span>Usuário</span>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label class="field">
          <span>Senha</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <label class="field" id="codeField" hidden>
          <span>Código do app autenticador</span>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
          <small class="form-hint">Perdeu o celular? Digite um dos códigos de recuperação.</small>
        </label>
        <p class="form-error" id="error" role="alert"></p>
        <button class="key key-go" type="submit" id="submit">Entrar</button>
      </form>
    </section>
  </main>

  <footer class="site-foot"><a href="/privacidade">Privacidade: como seus dados são usados</a></footer>

  <script src="/js/login.js"></script>
</body>
</html>
