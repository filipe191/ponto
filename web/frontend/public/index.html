<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponto</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-start">
      <a class="brand" href="/">Ponto</a>
      <span class="bar-company" id="company"></span>
    </div>
    <nav>
      <a href="/admin">Administração</a>
      <a href="/senha" data-admin hidden>Conta e segurança</a>
      <button type="button" id="kiosk" data-admin hidden>Usar como relógio</button>
      <button type="button" id="logout" data-admin hidden>Sair</button>
    </nav>
  </header>

  <main class="clock-page">
    <section class="machine" aria-label="Registrar ponto">
      <div class="readout">
        <div class="readout-time" aria-live="off"><span id="hm">--:--</span><span id="sec" class="readout-sec">--</span></div>
        <p class="readout-date" id="date"></p>
        <p class="readout-queue" id="queue" role="status" hidden></p>
      </div>

      <div class="pin" id="pin" aria-label="PIN digitado"></div>

      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key key-small" data-k="back" aria-label="Apagar último dígito">Apagar</button>
        <button class="key" data-k="0">0</button>
        <button class="key key-go" data-k="ok">Bater ponto</button>
        <button class="key key-small key-wide" data-k="mirror">Ver meu espelho</button>
      </div>

      <p class="slip" id="slip" role="status">Digite seu PIN e toque em Bater ponto.</p>
    </section>

    <section class="card" aria-labelledby="cardTitle">
      <header class="card-head">
        <h1 class="card-title" id="cardTitle">Seu cartão de hoje</h1>
        <p class="card-sub" id="cardDate"></p>
      </header>
      <div class="table-wrap">
        <table class="timecard">
          <thead id="todayHead"></thead>
          <tbody id="todayBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-foot"><a href="/privacidade">Privacidade: como seus dados são usados</a></footer>

  <!-- Espelho do próprio funcionário (aberto com o PIN) -->
  <dialog class="mirror" id="mirror" aria-labelledby="mirrorTitle">
    <header class="mirror-head">
      <div>
        <h2 id="mirrorTitle">Meu espelho</h2>
        <p class="card-sub" id="mirrorSub"></p>
      </div>
      <div class="mirror-nav">
        <button class="key key-small" type="button" id="mirrorPrev" aria-label="Mês anterior">‹</button>
        <button class="key key-small" type="button" id="mirrorNext" aria-label="Próximo mês">›</button>
        <button class="key key-go" type="button" id="mirrorClose">Fechar</button>
      </div>
    </header>
    <div class="mirror-summary" id="mirrorSummary"></div>
    <div id="mirrorAck"></div>
    <div class="table-wrap">
      <table class="timecard">
        <thead><tr><th>Dia</th><th>Batidas (comprovante)</th><th class="hours">Horas</th><th class="hours">Saldo</th></tr></thead>
        <tbody id="mirrorBody"></tbody>
      </table>
    </div>
    <p class="form-hint">Fecha sozinho depois de 1 minuto sem uso. * corrigida pelo administrador.</p>
  </dialog>

  <!-- Confirmação e avisos (no lugar do confirm()/alert() do navegador) -->
  <dialog class="ask" id="askDialog" aria-labelledby="askTitle">
    <h2 id="askTitle"></h2>
    <form method="dialog">
      <p class="ask-message" id="askMessage"></p>
      <div class="ask-actions">
        <button class="key key-small" value="cancel" id="askCancel">Cancelar</button>
        <button class="key key-go" value="ok" id="askOk">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="/js/index.js"></script>
</body>
</html>
