# Testes do backend (unitários e de integração com Postgres) e auditoria das dependências.
name: Backend

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: ponto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web/backend
    env:
      # Banco descartável: os testes de integração só rodam com "test" no nome (apagam e recriam o banco)
      PGHOST: localhost
      PGUSER: ponto
      PGPASSWORD: teste
      PGDATABASE: ponto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web/backend/requirements*.txt
      - name: Dependências
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Testes
        run: python -m pytest -q
      - name: Vulnerabilidades conhecidas
        run: pip-audit -r requirements.txt
