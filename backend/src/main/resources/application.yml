spring:
  application:
    name: ponto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ponto}
    username: ${DB_USER:ponto}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # o schema e do Flyway, nunca do Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

ponto:
  api-key: ${PONTO_API_KEY}   # sem default de proposito: sobe sem chave, nao sobe
  timezone: America/Sao_Paulo
  jornada-diaria: PT8H

logging:
  level:
    br.com.aurasoftware.ponto: INFO
