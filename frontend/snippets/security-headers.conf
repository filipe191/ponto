# Cabeçalhos de segurança. Repetidos em cada location que tem add_header próprio,
# porque o nginx não herda add_header do server nesses casos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Os scripts e estilos ficam dentro das páginas, por isso o 'unsafe-inline'; nada vem de outro site
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
