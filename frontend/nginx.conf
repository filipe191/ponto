server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Pergunta ao backend se o aparelho pode usar o relógio (relógio liberado ou admin logado)
    location = /_auth {
        internal;
        proxy_pass http://backend:3000/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Pergunta ao backend se o admin está logado
    location = /_auth_admin {
        internal;
        proxy_pass http://backend:3000/api/auth/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /login?next=$request_uri;
    }

    # Páginas públicas: tela de login e o estilo que ela usa
    location = /login {
        try_files /login.html =404;
    }
    location = /style.css {
        try_files $uri =404;
    }

    # A API faz a própria verificação de sessão
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui (não acrescenta): o cliente não consegue forjar o IP usado no limite de tentativas
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Administração: só com o login do admin
    location = /admin {
        auth_request /_auth_admin;
        error_page 401 = @login;
        try_files /admin.html =404;
    }
    location = /senha {
        auth_request /_auth_admin;
        error_page 401 = @login;
        try_files /senha.html =404;
    }

    # Tela do relógio e arquivos: relógio liberado ou admin logado
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
